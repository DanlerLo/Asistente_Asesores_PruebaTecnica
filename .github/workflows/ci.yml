# Integración continua: la suite completa en cada push y pull request (constitución, principio 3).
# Sin secretos ni LLM: las pruebas no usan red (LLM_PROVIDER=none por defecto).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ruff check src/backend tests/backend
      - run: python -m mypy
      - run: python -m pytest --cov --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
